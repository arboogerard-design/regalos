<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Regalos</title><style>:root{--bg:#0d0d0f;--tx:#ececec;--mu:#9a9aa2;--ac:#ff5a1f;--card:#17171b}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:720px;margin:auto;padding:40px 16px 80px}h1{font-size:30px;line-height:1.2}h2{font-size:21px;margin-top:36px}a{color:var(--ac)}pre{background:var(--card);border:1px solid #2a2a30;border-radius:12px;padding:16px;white-space:pre-wrap;font-size:14.5px;position:relative}code{font-family:ui-monospace,Consolas,monospace}button.cp{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:600;cursor:pointer}.pie{color:var(--mu);font-size:14px;margin-top:48px;border-top:1px solid #2a2a30;padding-top:16px}</style></head><body><main><h1>Regalos</h1>
<ul>
<li><a href="motion/">MOTION</a></li>
<li><a href="galeria/">GALERIA</a></li>
<li><a href="lampara/">LAMPARA</a></li>
</ul><p class="pie">Regalo de <a href="https://instagram.com/gerardleon.ai">@gerardleon.ai</a></p></main><script>document.querySelectorAll('pre').forEach(p=>{const b=document.createElement('button');b.className='cp';b.textContent='Copiar';b.onclick=()=>{navigator.clipboard.writeText(p.innerText.replace(/^Copiar/,'').replace(/Copiar$/,'').trim());b.textContent='Copiado';setTimeout(()=>b.textContent='Copiar',1500)};p.appendChild(b)})</script></body></html>
